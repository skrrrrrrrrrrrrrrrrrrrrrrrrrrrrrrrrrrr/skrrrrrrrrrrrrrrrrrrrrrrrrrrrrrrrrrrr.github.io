<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>김진성그는감히전설이라고할수있다</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Pretendard', sans-serif;
    }

    body{
      background:#f4f4f4;
      color:#222;
    }

    header{
      background:linear-gradient(135deg,#111,#333);
      color:white;
      padding:20px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:100;
    }

    .logo{
      font-size:24px;
      font-weight:bold;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      transition:0.3s;
    }

    nav a:hover{
      color:#ffcc00;
    }

    .hero{
      height:500px;
      background:
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      padding:20px;
    }

    .hero h1{
      font-size:52px;
      margin-bottom:20px;
    }

    .hero p{
      font-size:20px;
      margin-bottom:30px;
    }

    .hero button{
      padding:15px 30px;
      border:none;
      border-radius:10px;
      background:#ffcc00;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    .hero button:hover{
      transform:scale(1.05);
      background:white;
    }

    .section-title{
      text-align:center;
      margin:60px 0 30px;
      font-size:36px;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:30px;
      padding:0 40px 60px;
    }

    .card{
      background:white;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-10px);
    }

    .card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
    }

    .card h3{
      margin-bottom:10px;
    }

    .price{
      color:#e63946;
      font-size:22px;
      font-weight:bold;
      margin-bottom:15px;
    }

    .buy-btn{
      width:100%;
      padding:12px;
      border:none;
      background:#111;
      color:white;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }

    .buy-btn:hover{
      background:#ffcc00;
      color:black;
    }

    footer{
      background:#111;
      color:white;
      text-align:center;
      padding:30px;
      margin-top:50px;
    }

    @media(max-width:768px){
      .hero h1{
        font-size:36px;
      }

      .hero p{
        font-size:16px;
      }

      header{
        flex-direction:column;
        gap:10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">김진성그는감히전설이라고할수있다</div>

    <nav>
      <a href="#">홈</a>
      <a href="#">상품</a>
      <a href="#">이벤트</a>
      <a href="#">고객센터</a>
    </nav>
  </header>

  <section class="hero">
    <h1>전설급 쇼핑몰</h1>
    <p>최고의 상품을 가장 전설적인 가격으로 만나보세요.</p>
    <button>지금 쇼핑하기</button>
  </section>

  <h2 class="section-title">인기 상품</h2>

  <section class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1000&auto=format&fit=crop" alt="">
      <div class="card-content">
        <h3>전설 스니커즈</h3>
        <div class="price">₩129,000</div>
        <button class="buy-btn">구매하기</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=1000&auto=format&fit=crop" alt="">
      <div class="card-content">
        <h3>프리미엄 티셔츠</h3>
        <div class="price">₩39,000</div>
        <button class="buy-btn">구매하기</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1000&auto=format&fit=crop" alt="">
      <div class="card-content">
        <h3>레전드 헤드폰</h3>
        <div class="price">₩219,000</div>
        <button class="buy-btn">구매하기</button>
      </div>
    </div>

  </section>

  <footer>
    <p>© 2026 김진성그는감히전설이라고할수있다. All Rights Reserved.</p>
  </footer>

</body>
</html>
